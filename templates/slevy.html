<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Slevy týdne</title>
<style>
  :root {
    --bg: #f4f1ea; --panel: #fffdf8; --ink: #23201b; --muted: #746c5f; --line: #e3dccd;
    --accent: #b3261e; --ok: #2e6b3a; --img: #ffffff; --shadow: 0 1px 2px rgba(40,30,10,.08), 0 6px 18px rgba(40,30,10,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17150f; --panel: #211e17; --ink: #efe9dc; --muted: #a39a88; --line: #37322a;
            --accent: #ff7a6b; --ok: #8fd19e; --img: #f6f3ec; --shadow: 0 1px 2px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 22px 16px 10px; max-width: 1180px; margin: 0 auto;
           display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: end; }
  h1 { font-size: 1.55rem; margin: 0; letter-spacing: -.01em; }
  .stav { color: var(--muted); font-size: .9rem; flex: 1 1 220px; }
  button { font: inherit; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
           background: var(--panel); color: var(--ink); cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  nav.kotvy { max-width: 1180px; margin: 0 auto; padding: 4px 16px 6px; display: flex; flex-wrap: wrap; gap: 8px; }
  nav.kotvy a { text-decoration: none; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
                padding: 4px 11px; border-radius: 999px; font-size: .88rem; }
  main { max-width: 1180px; margin: 0 auto; padding: 0 16px 48px; }
  section { margin-top: 26px; }
  h2 { font-size: 1.15rem; margin: 0 0 10px; display: flex; align-items: baseline; gap: 10px; }
  h2 small { color: var(--muted); font-weight: 400; font-size: .85rem; }
  .mrizka { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; }
  .karta { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
           box-shadow: var(--shadow); display: flex; flex-direction: column; color: inherit; text-decoration: none; }
  .karta.nej { outline: 2px solid var(--ok); outline-offset: -1px; }
  .foto { position: relative; aspect-ratio: 4 / 3; background: var(--img); display: grid; place-items: center; }
  .foto img { max-width: 92%; max-height: 92%; object-fit: contain; }
  .foto .neni { color: #9a927f; font-size: .8rem; }
  .sleva { position: absolute; top: 8px; left: 8px; background: var(--accent); color: #fff; font-weight: 700;
           font-size: .82rem; padding: 2px 8px; border-radius: 999px; }
  .obchod { position: absolute; bottom: 8px; left: 8px; font-size: .74rem; font-weight: 700; padding: 2px 8px;
            border-radius: 6px; color: #fff; background: #555; }
  .o-lidl { background: #0050aa; } .o-kaufland { background: #c8102e; } .o-albert { background: #00843d; }
  .o-globus { background: #e35205; } .o-penny { background: #a6192e; } .o-billa { background: #c69200; }
  .text { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .nazev { font-size: .9rem; line-height: 1.3; }
  .cena { font-size: 1.25rem; font-weight: 700; margin-top: auto; }
  .pozn { color: var(--muted); font-size: .78rem; }
  .nejl { color: var(--ok); font-size: .74rem; font-weight: 700; }
  .pozn b.pod { color: var(--ok); } .pozn b.nad { color: var(--accent); }
  .nic, .chyba, .prazdno { margin-top: 26px; color: var(--muted); font-size: .92rem; }
  .chyba { color: var(--accent); }
  .prazdno { background: var(--panel); border: 1px dashed var(--line); border-radius: 14px; padding: 22px; }
  code { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
</style>
</head>
<body>
<header>
  <h1>Slevy týdne</h1>
  <div class="stav" id="stav">Načítám…</div>
  <button id="obnov">Stáhnout znovu</button>
</header>
<nav class="kotvy" id="kotvy"></nav>
<main id="obsah"></main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kc = c => c == null ? "cena neuvedena" : c.toFixed(2).replace(".", ",") + " Kč";
const den = d => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ""); return m ? (+m[3]) + ". " + (+m[2]) + "." : ""; };
const dnes = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const fold = s => String(s).normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-");

function karta(o, nej) {
  const pozn = [];
  if (o.jednotka) pozn.push(esc(o.jednotka.replace("cena za ", "za ")));
  if (o.od && o.od > dnes()) pozn.push("od " + den(o.od)); else if (o.do) pozn.push("do " + den(o.do));
  const foto = o.obrazek
    ? `<img loading="lazy" referrerpolicy="no-referrer" src="${esc(o.obrazek)}" alt="" onerror="this.outerHTML='<span class=neni>bez obrázku</span>'">`
    : `<span class="neni">bez obrázku</span>`;
  const tag = o.url ? "a" : "div";
  const href = o.url ? ` href="${esc(o.url)}" target="_blank" rel="noopener noreferrer"` : "";
  return `<${tag} class="karta${nej ? " nej" : ""}"${href}>
    <div class="foto">${foto}${o.sleva ? `<span class="sleva">−${o.sleva} %</span>` : ""}
      <span class="obchod o-${fold(o.obchod)}">${esc(o.obchod)}</span></div>
    <div class="text"><div class="nazev">${esc(o.nazev)}</div>
      ${nej ? `<div class="nejl">nejnižší cena</div>` : ""}
      <div class="cena">${kc(o.cena)}</div>
      ${o.za_kg ? `<div class="pozn">${kc(o.za_kg)}/kg${o.proti_obvykle != null ? ` · <b class="${o.proti_obvykle <= 0 ? "pod" : "nad"}">${o.proti_obvykle <= 0 ? "o " + (-o.proti_obvykle) + " % pod obvyklou" : "o " + o.proti_obvykle + " % nad obvyklou"}</b>` : ""}</div>` : ""}
      <div class="pozn">${pozn.join(" · ")}</div></div></${tag}>`;
}

async function nacti() {
  const d = await (await fetch("/api/slevy")).json();
  const stav = document.getElementById("stav"), obsah = document.getElementById("obsah"), kotvy = document.getElementById("kotvy");
  const tl = document.getElementById("obnov");
  tl.disabled = !!d.bezi; tl.textContent = d.bezi ? "Stahuji… (asi 2 minuty)" : "Stáhnout znovu";
  if (!d.seznam.length) {
    stav.textContent = ""; kotvy.innerHTML = "";
    obsah.innerHTML = `<div class="prazdno">V seznamu hlídaných slev zatím nic není. Přidáte ho Hansovi v chatu: <code>/sleva přidej máslo</code></div>`;
    return d;
  }
  if (!d.stazeno) {
    stav.textContent = "Letáky ještě nebyly staženy.";
    obsah.innerHTML = `<div class="prazdno">Hlídám: ${d.seznam.map(x => esc(x.polozka)).join(", ")}. Stiskněte „Stáhnout znovu“, nebo počkejte na středeční přehled.</div>`;
    kotvy.innerHTML = ""; return d;
  }
  const kdy = new Date(d.stazeno * 1000);
  stav.textContent = "Staženo " + kdy.toLocaleDateString("cs-CZ", {weekday: "long", day: "numeric", month: "numeric"})
    + " v " + kdy.toLocaleTimeString("cs-CZ", {hour: "2-digit", minute: "2-digit"})
    + " · v akci " + d.polozky.length + " z " + d.seznam.length + " hlídaných položek";
  kotvy.innerHTML = d.polozky.map(p => `<a href="#${fold(p.polozka)}">${esc(p.polozka)}</a>`).join("");
  let h = "";
  for (const p of d.polozky) {
    const nab = [...p.nabidky].sort((a, b) => (a.cena ?? 9e9) - (b.cena ?? 9e9));
    const kg = nab.filter(o => /1 ?kg|za 1 kg/i.test(o.nazev + " " + o.jednotka));
    const nejl = (kg.length >= 2 ? kg : nab.length >= 2 ? [] : [])[0];
    h += `<section id="${fold(p.polozka)}"><h2>${esc(p.polozka[0].toUpperCase() + p.polozka.slice(1))}
      <small>${nab.length} ${nab.length === 1 ? "nabídka" : nab.length < 5 ? "nabídky" : "nabídek"}${p.obvykle ? " · obvykle " + kc(p.obvykle.za_kg) + "/kg (ČSÚ, " + esc(p.obvykle.mesic_slovy) + ")" : ""}</small></h2>
      <div class="mrizka">${nab.map(o => karta(o, o === nejl)).join("")}</div></section>`;
  }
  if (d.nic.length) h += `<div class="nic">Tento týden nejsou v akci: ${d.nic.map(esc).join(", ")}.</div>`;
  if (d.chyby.length) h += `<div class="chyba">Nepodařilo se načíst: ${d.chyby.map(esc).join(", ")}.</div>`;
  if (!d.polozky.length) h = `<div class="prazdno">Tento týden není v akci nic z hlídaného seznamu.</div>` + h;
  obsah.innerHTML = h;
  return d;
}

document.getElementById("obnov").addEventListener("click", async () => {
  await fetch("/api/slevy/obnov", {method: "POST"});
  const cekej = async () => { const d = await nacti(); if (d.bezi) setTimeout(cekej, 5000); };
  cekej();
});
nacti().then(d => { if (d.bezi) { const c = async () => { const x = await nacti(); if (x.bezi) setTimeout(c, 5000); }; setTimeout(c, 5000); } });
</script>
</body>
</html>
