; Overrides values of the base Kvantum theme (KvMojaveLight, KvMojave, KvFlat…).
; Translucent windows and menus + a blur request to KWin,
; which the Liquid Glass effect then renders as glass.
[%General]
author=liquid-glass
comment=Translucent theme for the Liquid Glass KWin effect
composite=true
translucent_windows=true
blurring=true
popup_blurring=true
reduce_window_opacity=18
reduce_menu_opacity=22
menu_shadow_depth=6
tooltip_shadow_depth=4
